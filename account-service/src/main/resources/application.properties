spring.application.name=account-service
server.port=8081

management.endpoints.web.exposure.include=health,info

# Database (started with docker compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/accountdb
spring.datasource.username=phokaia
spring.datasource.password=phokaia

# Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka (EXTERNAL listener from docker compose)
spring.kafka.bootstrap-servers=localhost:9092

# Consumer: reads TransactionRequested events
spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# only build event objects from our own shared events package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.phokaia.events

# Producer: sends TransactionCompleted / TransactionFailed events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
