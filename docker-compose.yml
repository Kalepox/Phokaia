# Local infrastructure for Phokaia.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the database data)

services:

  # Database owned by account-service (each service has its own database)
  account-db:
    image: postgres:17
    container_name: phokaia-account-db
    environment:
      POSTGRES_DB: accountdb
      POSTGRES_USER: phokaia
      POSTGRES_PASSWORD: phokaia
    ports:
      - "5432:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data

  # Database owned by transaction-service
  transaction-db:
    image: postgres:17
    container_name: phokaia-transaction-db
    environment:
      POSTGRES_DB: transactiondb
      POSTGRES_USER: phokaia
      POSTGRES_PASSWORD: phokaia
    ports:
      - "5433:5432"
    volumes:
      - transaction-db-data:/var/lib/postgresql/data

  # Kafka message broker, single node in KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:4.1.0
    container_name: phokaia-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers connect via kafka:29092
      # EXTERNAL: apps running on your PC connect via localhost:9092
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so every internal topic can only have 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Web UI to browse topics and messages: http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: phokaia-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: phokaia
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

# Named volumes keep database data when containers are recreated
volumes:
  account-db-data:
  transaction-db-data:
