spring.application.name=notification-service
server.port=8083

management.endpoints.web.exposure.include=health,info

# Database (notification-db in docker compose, port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/notificationdb
spring.datasource.username=phokaia
spring.datasource.password=phokaia

# Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka (EXTERNAL listener from docker compose)
spring.kafka.bootstrap-servers=localhost:9092

# Consumer: reads TransactionCompleted / TransactionFailed results from account-service
# own group id → gets its own copy of every message, independent of transaction-service
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# only build event objects from our own shared events package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.phokaia.events
