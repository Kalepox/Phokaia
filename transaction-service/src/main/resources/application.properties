spring.application.name=transaction-service
server.port=8082

management.endpoints.web.exposure.include=health,info

# Database (transaction-db in docker compose, port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/transactiondb
spring.datasource.username=phokaia
spring.datasource.password=phokaia

# Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Kafka (EXTERNAL listener from docker compose)
spring.kafka.bootstrap-servers=localhost:9092
# key = transactionId (plain text), value = event record as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
